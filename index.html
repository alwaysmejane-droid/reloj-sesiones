<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<title>Reloj de sesiones</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#0f1720;--card:#17212d;--line:#243244;--txt:#eef3f8;--mut:#8ea0b4;--ok:#2fd18b;--off:#5d6b7c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:max(16px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));min-height:100vh}
main{max-width:460px;margin:0 auto}
h1{font-size:15px;font-weight:500;color:var(--mut);margin:0 0 12px;letter-spacing:.04em;text-transform:uppercase}
.rel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.lbl{font-size:12px;color:var(--mut)}
.hora{font-size:clamp(22px,7vw,32px);font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px;white-space:nowrap}
.hora small{font-size:.5em;font-weight:500;color:var(--mut);margin-left:3px}
.fecha{font-size:12px;color:var(--mut);margin-top:2px}
#cu{border-top:3px solid #f5a524}
#ny{border-top:3px solid #4da3ff}
#dif{font-size:12px;color:var(--mut);margin:10px 2px 14px}
.ses{display:flex;flex-direction:column;gap:10px}
.s{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:14px;padding:12px 14px}
.top{display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--off);flex:none}
.on .dot{background:var(--ok);box-shadow:0 0 0 4px rgba(47,209,139,.18)}
.nom{font-weight:600;font-size:16px}
.rng{font-size:12px;color:var(--mut)}
.rcu{color:#f5a524}
.der{margin-left:auto;text-align:right}
.est{font-size:12px;color:var(--off)}
.on .est{color:var(--ok)}
.cnt{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.der{flex:none}
.bar{height:5px;border-radius:3px;background:var(--line);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);width:0}
.noticias{display:block;margin-top:14px;text-align:center;text-decoration:none;color:var(--txt);background:#1d2b3b;border:1px solid var(--line);border-radius:14px;padding:13px;font-weight:600}
.noticias span{color:#f5a524}
.nots{display:flex;flex-direction:column;gap:8px}
.n{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ic);border-radius:12px;padding:9px 12px}
.n .h{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;min-width:64px}
.n .m{font-size:12px;font-weight:600;color:var(--mut);min-width:34px}
.n .t{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
.n .d{font-size:11px;color:var(--mut);display:block}
.n.pasada{opacity:.5}
.vacio{font-size:13px;color:var(--mut);text-align:center;padding:10px}
.pie{font-size:11px;color:var(--mut);text-align:center;margin-top:12px}
</style>
</head>
<body>
<main>
<h1>Reloj de sesiones</h1>
<div class="rel">
<div class="card" id="cu"><div class="lbl">Cuba</div><div class="hora" id="cuh">--:--:--</div><div class="fecha" id="cuf">&nbsp;</div></div>
<div class="card" id="ny"><div class="lbl">Nueva York</div><div class="hora" id="nyh">--:--:--</div><div class="fecha" id="nyf">&nbsp;</div></div>
</div>
<div id="dif"></div>
<div class="ses" id="ses"></div>
<h1 style="margin-top:18px">Noticias de hoy (hora de NY)</h1>
<div class="nots" id="nots"><div class="vacio">Cargando…</div></div>
<a class="noticias" href="https://www.forexfactory.com/calendar" target="_blank" rel="noopener"><span>●</span> Calendario completo</a>
<div class="pie">Sesiones en hora de Nueva York. Se actualiza sola.</div>
</main>
<script src="app.js"></script>
</body>
</html>
